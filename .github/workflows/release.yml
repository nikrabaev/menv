name: release

on:
  push:
    branches: [main]

# Serialize release runs on main; never cancel a publish mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # 1. Maintain the release PR (version bump + CHANGELOG from conventional commits).
  #    When that PR is merged, this creates the GitHub Release + tag and flips
  #    release_created -> true, which gates the publish job below.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 2. Only when a release was just created: build the binaries and publish to
  #    every channel. Platform packages go to npm BEFORE the launcher (its
  #    optionalDependencies pin them at the exact version).
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the GitHub Release
      id-token: write # npm OIDC trusted publishing + provenance
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      # Cross-compile all targets and assemble the launcher + platform packages.
      - name: Build binaries + npm packages
        run: bun run build:npm

      - name: Upload binaries + checksums to the GitHub Release
        run: |
          cd npm/dist/assets
          gh release upload "$TAG" ./* --clobber

      - name: Publish platform packages to npm
        run: |
          for dir in npm/dist/menv-*/; do
            echo "publishing $dir"
            ( cd "$dir" && npm publish )
          done

      - name: Publish launcher to npm
        run: |
          cd npm/dist/menv && npm publish

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: bun run scripts/update-homebrew.ts
