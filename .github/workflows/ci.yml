name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      # Catch build breaks early on the runner-native target (no cross download),
      # then confirm the version is still inlined into the binary from package.json.
      - name: Smoke compile + verify version embed
        run: |
          bun build --compile --target=bun-linux-x64 --outfile /tmp/menv-smoke src/index.ts
          version="$(node -p "require('./package.json').version")"
          echo "expecting embedded version: $version"
          strings /tmp/menv-smoke | grep -F "version: \"$version\""
